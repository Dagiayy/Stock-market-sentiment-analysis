[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-sentiment"
version = "1.0.0"
description = "News sentiment analysis and technical-indicator correlation platform for equities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dagmawi Ayenew" }]

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "nltk>=3.9",
  "textblob>=0.18",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "duckdb>=1.0",
  "pyarrow>=16.0",
  "yfinance>=0.2.40",
  "pandera>=0.19",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "anthropic>=0.30",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
stock-sentiment = "stock_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
